.btn{display:inline-flex;align-items:center;justify-content:center;padding:16px 34px;border-radius:999px;background:var(--burgundy);color:var(--cream);font-size:16px;font-weight:500;}

  <h1 style="font-family:'Cormorant Garamond',serif;font-size:52px;color:var(--ink);margin:0;font-weight:500;">Maison <em>Suzi</em></h1>
  <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--ink-mute);margin:0;">Horneado con pasión.</p>
