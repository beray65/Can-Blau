<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap">
<style>
:root{--cream:#FAF6EF;--ink:#2E1B12;--ink-mute:#6E5A48;--burgundy:#8A3B3B;}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);font-family:"Jost",sans-serif;}
.kicker{font-size:14px;font-weight:500;letter-spacing:0.24em;text-transform:uppercase;color:var(--burgundy);text-align:center;}
.cell{position:relative;border-radius:18px;overflow:hidden;}
.lbl{position:absolute;left:16px;bottom:14px;right:16px;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--cream);}
</style>
</helmet>
<div style="width:1080px;height:1920px;background:var(--cream);padding:64px 48px;display:flex;flex-direction:column;gap:36px;">

  <p class="kicker">Nuestros dulces</p>

  <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:20px;">

    <div class="cell" style="background:linear-gradient(160deg,#F0E4CC,#D8C6A3);">
      <p class="lbl" style="color:var(--ink);">Tartaletas</p>
    </div>

    <div class="cell" style="background:linear-gradient(160deg,#3A3A38,#232220);">
      <p class="lbl">Tiramisú</p>
    </div>

    <div class="cell" style="background:linear-gradient(160deg,#6E5A48,#4A3226);">
      <p class="lbl">Vasito frambuesa</p>
    </div>

    <div class="cell" style="background:linear-gradient(160deg,#F7EFDD,#E7D9BE);">
      <p class="lbl" style="color:var(--ink);">Tarta de queso</p>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
